<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formular Decont Staționare</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f8; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background: #fff; width: 100%; max-width: 600px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a252f; text-transform: uppercase; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        td { border: 1.5px solid #000; padding: 8px 10px; vertical-align: middle; }
        td.label { font-weight: bold; width: 40%; font-size: 14px; background: #fff; }
        td.input-cell { width: 60%; padding: 4px; }
        input, textarea { width: 100%; border: none; outline: none; padding: 6px; font-size: 15px; background: transparent; }
        
        .btn-time-picker {
            width: 100%;
            padding: 12px;
            background-color: #e9ecef;
            border: 1.5px dashed #6c757d;
            border-radius: 6px;
            font-weight: bold;
            color: #212529;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
        }
        .btn-time-picker:active { background-color: #dee2e6; }
        .hidden-inputs { display: none; }
        
        .btn-whatsapp {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; background-color: #25D366; color: white; border: none;
            padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="captureArea">
        <h2>Formular Decont</h2>
        <table>
            <tr>
                <td class="label">Nume Prenume</td>
                <td class="input-cell"><textarea id="nume" rows="1" placeholder="Introduceți numele"></textarea></td>
            </tr>
            <tr>
                <td class="label">Camion / Remorcă</td>
                <td class="input-cell"><textarea id="camion" rows="1" placeholder="EX: AR86TSK / AR87TSK"></textarea></td>
            </tr>
            <tr>
                <td class="label">Data și ora început</td>
                <td class="input-cell">
                    <button class="btn-time-picker" id="btnStart" type="button" onclick="openDatePicker('Start')">Setează data și ora început</button>
                    <div class="hidden-inputs">
                        <input type="date" id="dataStart" onchange="openTimePicker('Start')">
                        <input type="time" id="oraStart" onchange="calculeazaPauza()">
                    </div>
                </td>
            </tr>
            <tr>
                <td class="label">Data și ora sfârșit</td>
                <td class="input-cell">
                    <button class="btn-time-picker" id="btnEnd" type="button" onclick="openDatePicker('End')">Setează data și ora sfârșit</button>
                    <div class="hidden-inputs">
                        <input type="date" id="dataEnd" onchange="openTimePicker('End')">
                        <input type="time" id="oraEnd" onchange="calculeazaPauza()">
                    </div>
                </td>
            </tr>
            <tr>
                <td class="label">Total Staționare</td>
                <td class="input-cell"><textarea id="stationare" rows="1" placeholder="Calculat automat..."></textarea></td>
            </tr>
        </table>
    </div>

    <button class="btn-whatsapp" type="button" onclick="sendWhatsApp()">Trimite Pe WhatsApp</button>
</div>

<script>
// Pasul 1: Deschide selectorul de data
function openDatePicker(type) {
    const dateInput = document.getElementById('data' + type);
    if (dateInput.showPicker) {
        dateInput.showPicker();
    } else {
        dateInput.focus();
    }
}

// Pasul 2: Dupa ce s-a ales data (OK), deschide direct fereastra cu ora
function openTimePicker(type) {
    setTimeout(() => {
        const timeInput = document.getElementById('ora' + type);
        if (timeInput.showPicker) {
            timeInput.showPicker();
        } else {
            timeInput.focus();
        }
    }, 200);
}

// Pasul 3: Calculeaza automat diferenta de ore si minute
function calculeazaPauza() {
    const dStart = document.getElementById('dataStart').value;
    const tStart = document.getElementById('oraStart').value;
    const dEnd = document.getElementById('dataEnd').value;
    const tEnd = document.getElementById('oraEnd').value;

    if (dStart) {
        const dataFormatted = dStart.split('-').reverse().join('.');
        document.getElementById('btnStart').innerText = `${dataFormatted} ${tStart ? 'ora ' + tStart : ''}`;
    }
    if (dEnd) {
        const dataFormatted = dEnd.split('-').reverse().join('.');
        document.getElementById('btnEnd').innerText = `${dataFormatted} ${tEnd ? 'ora ' + tEnd : ''}`;
    }

    if (dStart && tStart && dEnd && tEnd) {
        const start = new Date(`${dStart}T${tStart}`);
        const end = new Date(`${dEnd}T${tEnd}`);
        let diffMins = Math.floor((end - start) / 60000);
        
        if (diffMins > 0) {
            let h = Math.floor(diffMins / 60);
            let m = diffMins % 60;
            document.getElementById('stationare').value = `${h} Ore ${m} Min`;
        } else {
            document.getElementById('stationare').value = "Data/ora incorecta";
        }
    }
}

// Pasul 4: Generare imagine si partajare WhatsApp
function sendWhatsApp() {
    const captureArea = document.getElementById('captureArea');
    html2canvas(captureArea, { scale: 2 }).then(canvas => {
        canvas.toBlob(blob => {
            const file = new File([blob], 'Decont.png', { type: 'image/png' });
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({ files: [file], title: 'Decont Staționare' });
            } else {
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = 'Decont.png';
                a.click();
            }
        });
    });
}
</script>

</body>
</html>
