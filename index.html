<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formular Decont</title>
    <!-- html2canvas pentru generare imagine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
        }
        .card-to-capture {
            background: #ffffff;
            padding: 10px;
            border-radius: 8px;
        }
        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            color: #1a252f;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            table-layout: fixed;
        }
        th, td {
            border: 1.5px solid #000000;
            padding: 8px 10px;
            text-align: left;
            word-wrap: break-word;
            vertical-align: middle;
        }
        td.label {
            font-weight: bold;
            width: 40%;
            background-color: #ffffff;
            color: #000000;
            font-size: 14px;
        }
        td.input-cell {
            width: 60%;
            padding: 4px 6px;
            background-color: #ffffff;
        }
        input, textarea {
            width: 100%;
            border: none;
            outline: none;
            padding: 6px 4px;
            font-size: 15px;
            background: transparent;
            font-family: inherit;
            resize: none;
            overflow: hidden;
            display: block;
        }
        input:focus, textarea:focus {
            background-color: #f0f7ff;
            border-radius: 4px;
        }
        .capitalize-input {
            text-transform: capitalize;
        }
        .uppercase-input {
            text-transform: uppercase;
        }
        .datetime-container {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            overflow: hidden;
        }
        .datetime-container input[type="date"],
        .datetime-container input[type="time"] {
            flex: 1;
            min-width: 0;
            padding: 4px 2px;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
        }
        .sub-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 2px;
            padding-left: 2px;
            font-weight: bold;
        }
        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background-color: #25D366;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease-in-out;
            text-decoration: none;
        }
        .btn-whatsapp:hover {
            background-color: #1ebc57;
        }
        .btn-whatsapp svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        @media (max-width: 480px) {
            td.label {
                font-size: 13px;
                padding: 6px;
            }
            td.input-cell {
                padding: 2px 4px;
            }
            .datetime-container input[type="date"],
            .datetime-container input[type="time"] {
                font-size: 11px;
                padding: 2px 1px;
            }
            input, textarea {
                font-size: 13px;
            }
            .sub-label {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card-to-capture" id="captureArea">
        <h2>Formular Decont</h2>
        
        <table>
            <tr>
                <td class="label">Nume Prenume</td>
                <td class="input-cell"><textarea id="nume" rows="1" class="capitalize-input" placeholder="Introduceți numele" onfocus="scrollToElement(this)" oninput="autoExpand(this); formatNumePrenume(this)"></textarea></td>
            </tr>
            <tr>
                <td class="label">Camion / Remorcă</td>
                <td class="input-cell"><textarea id="camion" rows="1" class="uppercase-input" placeholder="EX: AR86TSK / AR87TSK" onfocus="scrollToElement(this)" oninput="autoExpand(this); formatCamionRemorca(this)"></textarea></td>
            </tr>
            <tr>
                <td class="label">Data / Ora Plecare</td>
                <td class="input-cell">
                    <div class="datetime-container">
                        <input type="date" id="dataPlecare" onfocus="scrollToElement(this)" onclick="this.showPicker && this.showPicker()">
                        <input type="time" id="oraPlecare" onfocus="scrollToElement(this)" onclick="this.showPicker && this.showPicker()">
                    </div>
                </td>
            </tr>
            <tr>
                <td class="label">Data / Ora Sosire</td>
                <td class="input-cell">
                    <div class="datetime-container">
                        <input type="date" id="dataSosire" onfocus="scrollToElement(this)" onclick="this.showPicker && this.showPicker()">
                        <input type="time" id="oraSosire" onfocus="scrollToElement(this)" onclick="this.showPicker && this.showPicker()">
                    </div>
                </td>
            </tr>
            <tr>
                <td class="label">KM Plecare</td>
                <td class="input-cell"><textarea id="kmPlecare" rows="1" placeholder="EX: 150000" onfocus="scrollToElement(this)" oninput="autoExpand(this)"></textarea></td>
            </tr>
            <tr>
                <td class="label">KM Sosire</td>
                <td class="input-cell"><textarea id="kmSosire" rows="1" placeholder="EX: 152500" onfocus="scrollToElement(this)" oninput="autoExpand(this)"></textarea></td>
            </tr>
            <tr>
                <td class="label">Descărcări</td>
                <td class="input-cell"><textarea id="descarcari" rows="1" placeholder="EX: 3" onfocus="scrollToElement(this)" oninput="autoExpand(this)"></textarea></td>
            </tr>
            <tr>
                <td class="label">Încărcări</td>
                <td class="input-cell"><textarea id="incarcari" rows="1" placeholder="EX: 2" onfocus="scrollToElement(this)" oninput="autoExpand(this)"></textarea></td>
            </tr>
            
            <!-- SECȚIUNEA MODIFICATĂ: PERIOADA STAȚIONARE -->
            <tr>
                <td class="label">Perioada Staționare</td>
                <td class="input-cell">
                    <div class="sub-label">Început:</div>
                    <div class="datetime-container" style="margin-bottom: 8px;">
                        <input type="date" id="dataInceputStationare" onfocus="scrollToElement(this)" onclick="this.showPicker && this.showPicker()">
                        <input type="time" id="oraInceputStationare" onfocus="scrollToElement(this)" onclick="this.showPicker && this.showPicker()">
                    </div>
                    <div class="sub-label">Sfârșit:</div>
                    <div class="datetime-container">
                        <input type="date" id="dataSfarsitStationare" onfocus="scrollToElement(this)" onclick="this.showPicker && this.showPicker()">
                        <input type="time" id="oraSfarsitStationare" onfocus="scrollToElement(this)" onclick="this.showPicker && this.showPicker()">
                    </div>
                </td>
            </tr>
            <!-- SFÂRȘIT SECȚIUNE MODIFICATĂ -->

            <tr>
                <td class="label">Alte Cheltuieli</td>
                <td class="input-cell"><textarea id="cheltuieli" rows="1" placeholder="EX: Autohof 9 EUR" onfocus="scrollToElement(this)" oninput="autoExpand(this)"></textarea></td>
            </tr>
        </table>
    </div>

    <button class="btn-whatsapp" onclick="sendWhatsApp()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
            <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3 18.6-68.1-4.4-7C50 322 39 285.5 39 248c0-101.9 82.9-184.8 184.8-184.8 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.9-186.4 184.9zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
        </svg>
        Trimite Pe WhatsApp
    </button>
</div>

<script>
function scrollToElement(elem) {
    setTimeout(function() {
        elem.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 300);
}

function autoExpand(field) {
    field.style.height = 'inherit';
    var computed = window.getComputedStyle(field);
    var height = parseInt(computed.getPropertyValue('border-top-width'), 10)
                 + parseInt(computed.getPropertyValue('padding-top'), 10)
                 + field.scrollHeight
                 + parseInt(computed.getPropertyValue('padding-bottom'), 10)
                 + parseInt(computed.getPropertyValue('border-bottom-width'), 10);
    field.style.height = height + 'px';
}

function formatNumePrenume(input) {
    let words = input.value.split(' ');
    for (let i = 0; i < words.length; i++) {
        if (words[i].length > 0) {
            words[i] = words[i].charAt(0).toUpperCase() + words[i].slice(1);
        }
    }
    input.value = words.join(' ');
}

function formatCamionRemorca(input) {
    let val = input.value.toUpperCase();
    if (val.length > 2 && !val.includes('/') && val.endsWith(' ')) {
        val = val.trim() + ' / ';
    }
    input.value = val;
}

function sendWhatsApp() {
    const captureArea = document.getElementById('captureArea');
    const numeComplet = document.getElementById('nume').value.trim();
    const textMesaj = numeComplet ? `Decont: ${numeComplet}` : 'Decont completat';

    const inputs = captureArea.querySelectorAll('textarea, input[type="date"], input[type="time"]');
    const originalValues = [];
    
    inputs.forEach(input => {
        originalValues.push({ element: input, parent: input.parentNode, value: input.value });
        const span = document.createElement('span');
        span.style.fontSize = '14px';
        span.style.padding = '6px 4px';
        span.style.display = 'block';
        span.style.fontWeight = '500';
        span.style.whiteSpace = 'pre-wrap';
        span.style.wordBreak = 'break-word';
        
        if (input.type === 'date') {
            if (input.value) {
                const parts = input.value.split('-');
                span.textContent = `${parts[2]}.${parts[1]}.${parts[0]}`;
                span.style.fontSize = '12px';
            } else {
                span.textContent = '-';
            }
        } else if (input.type === 'time') {
            span.textContent = input.value ? input.value : '-';
            span.style.fontSize = '12px';
        } else {
            span.textContent = input.value.trim() || '-';
        }
        
        input.parentNode.replaceChild(span, input);
    });

    html2canvas(captureArea, { scale: 2 }).then(canvas => {
        const spans = captureArea.querySelectorAll('span');
        spans.forEach((span, index) => {
            const item = originalValues[index];
            span.parentNode.replaceChild(item.element, span);
        });

        canvas.toBlob(blob => {
            const file = new File([blob], 'Decont.png', { type: 'image/png' });

            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({
                    files: [file],
                    title: 'Formular Decont',
                    text: textMesaj
                }).catch(() => {});
            } else {
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = 'Decont.png';
                a.click();
                
                alert(`Imaginea decontului a fost descărcată (Decont.png)! O puteți atașa pe WhatsApp pentru ${textMesaj}.`);
                
                const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(textMesaj)}`;
                window.open(whatsappUrl, '_blank');
            }
        }, 'image/png');
    });
}
</script>

</body>
</html>
